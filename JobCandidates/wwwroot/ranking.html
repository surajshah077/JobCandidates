<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobCandidates - Ranking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="jobs.html">JobCandidates</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="candidates.html">Candidates</a></li>
                    <li class="nav-item"><a class="nav-link" href="applications.html">Applications</a></li>
                    <li class="nav-item"><a class="nav-link" href="interviews.html">Interviews</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ranking.html">Ranking</a></li>
                    <li class="nav-item"><a class="nav-link" href="analytics.html">Analytics</a></li>
                </ul>
                <button id="btnLogout" class="btn btn-outline-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="messages" class="mb-3"></div>

        <div id="authStatus" class="alert alert-info d-flex justify-content-between align-items-center">
            <div>
                <strong>Loading...</strong>
                <span id="authDetails" class="ms-2"></span>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header">Candidate Ranking</div>
                    <div class="card-body">
                        <form id="rankingForm">
                            <div class="mb-3">
                                <label for="rankingJobId" class="form-label">Job ID</label>
                                <input type="number" min="1" class="form-control" id="rankingJobId" placeholder="Enter Job ID" required>
                            </div>
                            <button type="submit" id="btnLoadRanking" class="btn btn-primary w-100">Load Ranking</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Ranked Candidates</span>
                        <button class="btn btn-outline-primary btn-sm" id="btnRefreshRanking">Refresh</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped" id="rankingTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Rank</th>
                                        <th>Candidate ID</th>
                                        <th>Candidate Name</th>
                                        <th>Experience Years</th>
                                        <th>Skill Match Score</th>
                                        <th>Total Score</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="6" class="text-center text-muted">No ranking loaded.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="rankingSummary" class="small text-muted mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
