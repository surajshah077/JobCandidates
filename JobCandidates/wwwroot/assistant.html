<div class="container my-4" id="assistantSection">
    <h3 class="mb-3">LLM Assistant for Recruiters</h3>

    <div class="mb-4 p-3 border rounded bg-light">
        <h5>Generate Interview Questions</h5>
        <div class="row g-2">
            <div class="col-md-6"><input id="aqJobTitle" class="form-control" placeholder="Job Title"></div>
            <div class="col-md-6"><input id="aqCandidateName" class="form-control" placeholder="Candidate Name"></div>
            <div class="col-12"><input id="aqJobDescription" class="form-control" placeholder="Job Description"></div>
            <div class="col-12"><input id="aqRequiredSkills" class="form-control" placeholder="Required Skills"></div>
            <div class="col-md-6"><input id="aqCandidateSkills" class="form-control" placeholder="Candidate Skills"></div>
            <div class="col-md-6"><input id="aqExperienceYears" type="number" class="form-control" placeholder="Experience Years"></div>
            <div class="col-12"><button class="btn btn-primary mt-2" onclick="generateQuestions()">Generate Questions</button></div>
        </div>
        <pre id="aqResult" class="mt-3 p-3 bg-white border rounded" style="white-space: pre-wrap;"></pre>
    </div>

    <div class="mb-4 p-3 border rounded bg-light">
        <h5>Explain Ranking</h5>
        <div class="row g-2">
            <div class="col-md-6"><input id="erJobTitle" class="form-control" placeholder="Job Title"></div>
            <div class="col-md-6"><input id="erCandidateName" class="form-control" placeholder="Candidate Name"></div>
            <div class="col-md-4"><input id="erMatchedSkillCount" type="number" class="form-control" placeholder="Matched Skill Count"></div>
            <div class="col-md-4"><input id="erTotalRequiredSkills" type="number" class="form-control" placeholder="Total Required Skills"></div>
            <div class="col-md-4"><input id="erExperienceYears" type="number" class="form-control" placeholder="Experience Years"></div>
            <div class="col-md-6"><input id="erSemanticScore" type="number" step="0.01" class="form-control" placeholder="Semantic Score (0-1)"></div>
            <div class="col-md-6"><input id="erCombinedScore" type="number" step="0.01" class="form-control" placeholder="Combined Score"></div>
            <div class="col-12"><button class="btn btn-primary mt-2" onclick="explainRanking()">Explain Ranking</button></div>
        </div>
        <pre id="erResult" class="mt-3 p-3 bg-white border rounded" style="white-space: pre-wrap;"></pre>
    </div>

    <div class="mb-4 p-3 border rounded bg-light">
        <h5>Email Template</h5>
        <div class="row g-2">
            <div class="col-md-6"><input id="etCandidateName" class="form-control" placeholder="Candidate Name"></div>
            <div class="col-md-6"><input id="etJobTitle" class="form-control" placeholder="Job Title"></div>
            <div class="col-md-6">
                <select id="etEmailType" class="form-select">
                    <option value="invite">Invite</option>
                    <option value="rejection">Rejection</option>
                    <option value="follow-up">Follow-up</option>
                </select>
            </div>
            <div class="col-md-6"><input id="etOptionalNotes" class="form-control" placeholder="Optional Notes"></div>
            <div class="col-12"><button class="btn btn-primary mt-2" onclick="generateEmailTemplate()">Generate Email</button></div>
        </div>
        <pre id="etResult" class="mt-3 p-3 bg-white border rounded" style="white-space: pre-wrap;"></pre>
    </div>
</div>
