<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>JobCandidates - Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075);
        }

        #messages {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1080;
            width: min(420px, calc(100vw - 32px));
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">JobCandidates</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Auth</a></li>
                    <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="candidates.html">Candidates</a></li>
                    <li class="nav-item"><a class="nav-link" href="applications.html">Applications</a></li>
                    <li class="nav-item"><a class="nav-link" href="interviews.html">Interviews</a></li>
                    <li class="nav-item"><a class="nav-link" href="ranking.html">Ranking</a></li>
                    <li class="nav-item"><a class="nav-link" href="analytics.html">Analytics</a></li>
                </ul>
                <button class="btn btn-outline-light btn-sm" id="btnLogout" type="button" disabled>Logout</button>
            </div>
        </div>
    </nav>

    <div id="messages"></div>

    <div class="container py-4">
        <div class="alert alert-info d-flex justify-content-between align-items-center" id="authStatus">
            <div>
                <strong>Not authenticated.</strong>
                <span id="authDetails" class="ms-2">Please login first.</span>
            </div>
        </div>

        <div class="row g-3">
            <!-- Left Column -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header fw-semibold">Create Account</div>
                    <div class="card-body">
                        <form id="registerForm" novalidate>
                            <div class="mb-2">
                                <label class="form-label" for="registerName">Name</label>
                                <input class="form-control" id="registerName" required />
                            </div>
                            <div class="mb-2">
                                <label class="form-label" for="registerAge">Age</label>
                                <input class="form-control" id="registerAge" type="number" min="18" max="80" required />
                            </div>
                            <div class="mb-2">
                                <label class="form-label" for="registerGender">Gender</label>
                                <select class="form-select" id="registerGender" required>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                    <option value="PreferNotToSay" selected>Prefer Not To Say</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label" for="registerEmail">Email</label>
                                <input class="form-control" id="registerEmail" type="email" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="registerRole">Role</label>
                                <select class="form-select" id="registerRole" required>
                                    <option value="User" selected>User</option>
                                    <option value="Recruiter">Recruiter</option>
                                </select>
                            </div>
                            <button class="btn btn-primary w-100" id="btnRegister" type="submit">Send Registration OTP</button>
                        </form>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header fw-semibold">Verify Registration OTP</div>
                    <div class="card-body">
                        <form id="registerVerifyForm" novalidate>
                            <div class="mb-2">
                                <label class="form-label" for="registerVerifyEmail">Email</label>
                                <input class="form-control" id="registerVerifyEmail" type="email" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="registerOtpCode">OTP Code</label>
                                <input class="form-control" id="registerOtpCode" required placeholder="Enter 6-digit OTP" />
                            </div>
                            <button class="btn btn-success w-100" id="btnVerifyRegister" type="submit">Verify & Login</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header fw-semibold">Request Login OTP</div>
                    <div class="card-body">
                        <form id="loginRequestForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label" for="loginEmail">Email</label>
                                <input class="form-control" id="loginEmail" type="email" required />
                            </div>
                            <button class="btn btn-warning w-100" id="btnRequestLoginOtp" type="submit">Send Login OTP</button>
                        </form>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header fw-semibold">Verify Login OTP</div>
                    <div class="card-body">
                        <form id="loginVerifyForm" novalidate>
                            <div class="mb-2">
                                <label class="form-label" for="loginVerifyEmail">Email</label>
                                <input class="form-control" id="loginVerifyEmail" type="email" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="loginOtpCode">OTP Code</label>
                                <input class="form-control" id="loginOtpCode" required placeholder="Enter 6-digit OTP" />
                            </div>
                            <button class="btn btn-success w-100" id="btnVerifyLogin" type="submit">Login</button>
                        </form>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header fw-semibold">Current User</div>
                    <div class="card-body">
                        <p class="mb-1"><strong>Email:</strong> <span id="currentUserEmail">-</span></p>
                        <p class="mb-0"><strong>Role:</strong> <span id="currentUserRole">-</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
