<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>JobCandidates - Interviews</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075);
        }

        #messages {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1080;
            width: min(420px, calc(100vw - 32px));
        }

        .table-wrap {
            max-height: 420px;
            overflow: auto;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: .75rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark navbar-expand">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">JobCandidates</a>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>
                <li class="nav-item"><a class="nav-link" href="candidates.html">Candidates</a></li>
                <li class="nav-item"><a class="nav-link" href="applications.html">Applications</a></li>
                <li class="nav-item"><a class="nav-link active" href="interviews.html">Interviews</a></li>
                <li class="nav-item"><a class="nav-link" href="ranking.html">Ranking</a></li>
                <li class="nav-item"><a class="nav-link" href="analytics.html">Analytics</a></li>
            </ul>
        </div>
    </nav>

    <div id="messages"></div>

    <div class="container py-4">
        <div class="alert alert-info d-flex justify-content-between align-items-center" id="authStatus">
            <div>
                <strong>Not authenticated.</strong>
                <span id="authDetails">Create an account or login to continue.</span>
            </div>
            <button class="btn btn-sm btn-outline-secondary" id="btnLogout">Logout</button>
        </div>

        <div class="row g-3">
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header">Create Interview</div>
                    <div class="card-body">
                        <form id="interviewCreateForm">
                            <div class="mb-2">
                                <label class="form-label">Application ID</label>
                                <input class="form-control" id="interviewApplicationId" type="number" min="1" required />
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Interview Date</label>
                                <input class="form-control" id="interviewDate" type="date" required />
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Mode</label>
                                <input class="form-control" id="interviewMode" placeholder="Online / Offline" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Feedback</label>
                                <textarea class="form-control" id="interviewFeedback" rows="3"></textarea>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Create Interview</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="section-title mb-0">Interviews List</div>
                    <button class="btn btn-sm btn-outline-primary" id="btnRefreshInterviews">Refresh</button>
                </div>
                <div class="table-responsive table-wrap">
                    <table class="table table-striped table-bordered" id="interviewsTable">
                        <thead class="table-dark">
                            <tr>
                                <th>Id</th>
                                <th>Candidate</th>
                                <th>Date</th>
                                <th>Mode</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

   
</body>
</html>
